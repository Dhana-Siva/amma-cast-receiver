<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Amma Cast Receiver</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #idle {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-family: sans-serif; font-size: 2vw; opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="idle">Amma</div>
  <div id="player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    // Custom namespace Amma's iOS app sends "play this video" messages on.
    // Kept app-specific (not a generic name) to avoid colliding with any
    // other Cast sender that might reach this same namespace convention.
    const NAMESPACE = 'urn:x-cast:com.dhana.amma.cast';

    let ytPlayer = null;
    let pendingVideoId = null;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { autoplay: 1, controls: 0, rel: 0 },
        events: {
          onReady: () => {
            if (pendingVideoId) {
              playVideo(pendingVideoId);
              pendingVideoId = null;
            }
          }
        }
      });
    }

    function playVideo(videoId) {
      document.getElementById('idle').style.display = 'none';
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
      } else {
        // Player not constructed yet — stash it for onReady to pick up.
        pendingVideoId = videoId;
      }
    }

    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NAMESPACE, (event) => {
      const videoId = event.data && event.data.videoId;
      if (videoId) playVideo(videoId);
    });

    context.start();
  </script>
</body>
</html>
