<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Amma Cast Receiver</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #idle {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-family: sans-serif; font-size: 2vw; opacity: 0.6;
    }
    #debug {
      position: absolute; bottom: 8px; left: 8px; right: 8px;
      color: rgba(255,255,255,0.75); font-family: monospace; font-size: 22px;
      line-height: 1.4; white-space: pre-wrap; word-break: break-all;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="idle">Amma</div>
  <div id="player"></div>
  <!-- Visible last-message trace — there's no remote console access to this
       screen, so this is how we confirm what actually arrived, in place of
       browser devtools. -->
  <div id="debug"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    // Custom namespace Amma's iOS app sends "play this video" messages on.
    // Kept app-specific (not a generic name) to avoid colliding with any
    // other Cast sender that might reach this same namespace convention.
    const NAMESPACE = 'urn:x-cast:com.dhana.amma.cast';

    let ytPlayer = null;
    let pendingVideoId = null;

    // Small on-screen scrolling log — there's no remote console access to
    // this screen, so this is the only way to see what's actually happening
    // when something doesn't play.
    const debugLines = [];
    function debugLog(message) {
      debugLines.push(new Date().toLocaleTimeString() + ' ' + message);
      while (debugLines.length > 8) debugLines.shift();
      const el = document.getElementById('debug');
      if (el) el.textContent = debugLines.join('\n');
    }

    window.onerror = (message, source, lineno) => {
      debugLog('JS ERROR: ' + message + ' (line ' + lineno + ')');
    };

    // If this never logs, the YouTube iframe API script itself failed to
    // load/execute on this device — a different problem than anything
    // player-related below.
    debugLog('page loaded, waiting for YT API...');

    function onYouTubeIframeAPIReady() {
      debugLog('YT API ready, creating player');
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { autoplay: 1, controls: 0, rel: 0 },
        events: {
          onReady: () => {
            debugLog('player onReady');
            if (pendingVideoId) {
              playVideo(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onError: (e) => {
            // Common codes: 2 invalid param, 5 HTML5 error, 100 not found,
            // 101/150 embedding disabled by the video's owner.
            debugLog('player onError code=' + e.data);
          },
          onStateChange: (e) => {
            debugLog('player state=' + e.data);
          }
        }
      });
    }

    function playVideo(videoId) {
      debugLog('playVideo ' + videoId);
      document.getElementById('idle').style.display = 'none';
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
      } else {
        // Player not constructed yet — stash it for onReady to pick up.
        debugLog('player not ready yet, stashing videoId');
        pendingVideoId = videoId;
      }
    }

    function stopVideo() {
      debugLog('stopVideo');
      pendingVideoId = null;
      if (ytPlayer && ytPlayer.stopVideo) {
        ytPlayer.stopVideo();
      }
      document.getElementById('idle').style.display = 'flex';
    }

    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NAMESPACE, (event) => {
      // event.data's exact shape (raw JSON string vs. already-parsed object)
      // isn't documented, so handle both rather than assume one.
      let data = event.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (e) {
          data = {};
        }
      }
      data = data || {};

      debugLog('received: ' + JSON.stringify(data));

      if (data.action === 'stop') {
        stopVideo();
      } else if (data.videoId) {
        playVideo(data.videoId);
      }
    });

    context.start();
  </script>
</body>
</html>
